name: iOS Production → TestFlight (Manual)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build & Export Production iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Select latest Xcode version
        run: |
          echo "Available Xcode installations:"
          ls /Applications/ | grep -i xcode || true
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Selecting: $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Validate required secrets
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          for var in IOS_DISTRIBUTION_P12_BASE64 IOS_CERTIFICATE_PASSWORD BUILD_PROVISION_PROFILE_BASE64 APPLE_TEAM_ID APP_STORE_CONNECT_API_KEY_BASE64 APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required secret: $var"
              exit 1
            fi
          done

          KEY_PATH="$RUNNER_TEMP/app-store-connect-authkey.p8"
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_PATH"; then
            echo "::error::APP_STORE_CONNECT_API_KEY_BASE64 did not decode to a valid .p8 private key"
            exit 1
          fi

      - name: Create temporary keychain
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      - name: Import distribution certificate
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/distribution.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo "${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}" | base64 --decode > "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "${{ secrets.IOS_CERTIFICATE_PASSWORD }}" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "${{ secrets.KEYCHAIN_PASSWORD }}" \
            "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        run: |
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo "${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}" | base64 --decode > "$PP_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_UUID=$(openssl smime -inform der -verify -noverify -in "$PP_PATH" 2>/dev/null \
            | python3 -c "import plistlib, sys; pl = plistlib.loads(sys.stdin.buffer.read()); print(pl['UUID'])")
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "Installed provisioning profile UUID: $PROFILE_UUID"

      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml

      - name: Set CI build number
        run: |
          BUILD_NUMBER="${{ github.run_number }}"
          echo "CURRENT_PROJECT_VERSION=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Using CURRENT_PROJECT_VERSION=$BUILD_NUMBER"

      - name: Archive app (Release configuration → production backend)
        run: |
          xcodebuild archive \
            -project ios/FortuneTeller.xcodeproj \
            -scheme FortuneTeller \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/FortuneTeller.xcarchive" \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="FortuneTeller888" \
            BACKEND_BASE_URL="https://fortuneteller-production-f93e.up.railway.app" \
            CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION"

      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/exportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>uploadSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>ai.movenova.fortuneteller</key>
              <string>FortuneTeller888</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/FortuneTeller.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist"
          IPA_PATH=$(find "$RUNNER_TEMP/export" -name "*.ipa" | head -1)
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"
          echo "Exported IPA: $IPA_PATH"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FortuneTeller-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 30

      - name: Upload to TestFlight
        env:
          ASC_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          ASC_API_KEY_ID_RAW: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_API_ISSUER_ID_RAW: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -o pipefail

          # Strip any accidental whitespace / newlines pasted into the secret values.
          ASC_API_KEY_ID="$(printf '%s' "$ASC_API_KEY_ID_RAW" | tr -d '[:space:]')"
          ASC_API_ISSUER_ID="$(printf '%s' "$ASC_API_ISSUER_ID_RAW" | tr -d '[:space:]')"

          # Non-sensitive diagnostics: lengths only, so we can see if the
          # secrets are obviously empty / wrong size without leaking values.
          echo "APP_STORE_CONNECT_API_KEY_ID length: ${#ASC_API_KEY_ID}"
          echo "APP_STORE_CONNECT_API_ISSUER_ID length: ${#ASC_API_ISSUER_ID}"
          if [ "${#ASC_API_KEY_ID}" -ne 10 ]; then
            echo "::error::APP_STORE_CONNECT_API_KEY_ID must be exactly 10 characters (got ${#ASC_API_KEY_ID})."
            exit 1
          fi
          if [ "${#ASC_API_ISSUER_ID}" -ne 36 ]; then
            echo "::error::APP_STORE_CONNECT_API_ISSUER_ID must be a 36-character UUID (got ${#ASC_API_ISSUER_ID})."
            exit 1
          fi

          mkdir -p ~/.appstoreconnect/private_keys/
          KEY_PATH=~/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8
          printf '%s' "$ASC_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"

          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_PATH"; then
            echo "::error::Decoded App Store Connect API key is not a valid PEM .p8 file."
            rm -f "$KEY_PATH"
            exit 1
          fi
          echo "Wrote API key to: $KEY_PATH ($(wc -l < "$KEY_PATH") lines)"

          ALTOOL_LOG="$RUNNER_TEMP/altool.log"
          set +e
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID" \
            --verbose 2>&1 | tee "$ALTOOL_LOG"
          ALTOOL_STATUS=${PIPESTATUS[0]}
          set -e

          rm -f "$KEY_PATH"

          # altool sometimes exits 0 even when Apple returns 401, so we
          # explicitly fail on auth / upload errors found in the log.
          if [ "$ALTOOL_STATUS" -ne 0 ]; then
            echo "::error::altool exited with status $ALTOOL_STATUS"
            exit "$ALTOOL_STATUS"
          fi
          if grep -E "NOT_AUTHORIZED|status code: 401|failed to authenticate" "$ALTOOL_LOG" >/dev/null; then
            echo "::error::App Store Connect rejected the API credentials (401 NOT_AUTHORIZED). Verify APP_STORE_CONNECT_API_KEY_ID, APP_STORE_CONNECT_API_ISSUER_ID, and APP_STORE_CONNECT_API_KEY_BASE64 all belong to the same active key with App Manager access."
            exit 1
          fi
          if ! grep -E "UPLOAD SUCCEEDED|No errors uploading" "$ALTOOL_LOG" >/dev/null; then
            echo "::error::altool did not report a successful upload. See log above."
            exit 1
          fi

      - name: Clean up keychain and provisioning profile
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision || true