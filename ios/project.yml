name: FortuneTeller
options:
  bundleIdPrefix: com.hgao168.fortuneteller888
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
  defaultConfig: Debug
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_KEY_NSCameraUsageDescription: "FortuneTeller uses the camera to read your palm."
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "FortuneTeller uses your photos so you can upload a palm picture."
targets:
  FortuneTeller:
    type: application
    platform: iOS
    sources:
      - FortuneTeller
    info:
      path: FortuneTeller/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
        BACKEND_BASE_URL: "http://localhost:8000"
        NSCameraUsageDescription: "FortuneTeller uses the camera to read your palm."
        NSPhotoLibraryUsageDescription: "FortuneTeller uses your photos so you can upload a palm picture."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hgao168.fortuneteller888
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          BACKEND_BASE_URL: "http://localhost:8000"
        Release:
          BACKEND_BASE_URL: "https://YOUR-PROD-API.example.com"
  FortuneTellerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FortuneTellerTests
    dependencies:
      - target: FortuneTeller
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hgao168.fortuneteller888.tests
        GENERATE_INFOPLIST_FILE: YES
